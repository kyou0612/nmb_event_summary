* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TIMES = {
  online: ['10:00', '11:15', '12:30', '13:45', '15:00', '16:30', '17:45', '19:00'],
  hand: ['10:00', '11:10', '12:20', '13:30', '14:40', '15:50', '17:00', '18:30', '19:40'],
  makuhari: ['11:00', '12:10', '13:20', '14:30', '15:40', '17:10', '18:20'],
};
let cur = null;
try { if (localStorage.getItem('nmb34-plans-only') === '1') $('#only').checked = true; } catch (e) {}

function renderTabs() {
  $('#tabs').innerHTML = DATA.events.map((e) =>
    `<button class="tab" role="tab" data-key="${e.key}" data-kind="${e.kind}" aria-selected="${e.key === cur}">
      <span class="k">${e.kind === 'online' ? 'オンライン' : '握手会 ' + esc(e.venue)}</span>
      <span class="d">${e.md}<small>${e.wd}</small></span></button>`).join('');
}

function cellHtml(c) {
  if (!c) return '<td class="void"></td>';
  if (c.plan) return `<td class="has-plan"><div class="plan" title="${esc(c.plan)}">${c.star ? '<span class="star">★</span>' : ''}${esc(c.plan)}</div></td>`;
  if (c.star) return '<td><span class="rec">★おすすめ</span></td>';
  return '<td><span class="none">—</span></td>';
}

function render() {
  const ev = DATA.events.find((e) => e.key === cur);
  const q = $('#q').value.trim();
  const only = $('#only').checked;
  const times = ev.kind === 'online' ? TIMES.online : ev.venue === '幕張メッセ' ? TIMES.makuhari : TIMES.hand;
  const has = (r) => r.cells.some((c) => c && (c.plan || c.star));
  const rows = ev.rows.filter((r) => (!q || r.name.includes(q)) && (!only || has(r)));
  $('#summary').innerHTML = `<span>企画あり <b>${ev.rows.filter(has).length}</b> / ${ev.rows.length} 名</span>`;
  if (!rows.length) { $('#box').innerHTML = '<div class="empty">条件に合うメンバーがいません。絞り込みを外してください。</div>'; return; }
  const head = `<colgroup><col class="c-name">${ev.cols.map(() => '<col class="c-slot">').join('')}</colgroup>`
    + `<thead><tr><th class="name">メンバー</th>${ev.cols.map((n) => `<th>${n}部<span class="t">${times[n - 1] || ''}〜</span></th>`).join('')}</tr></thead>`;
  const body = rows.map((r) => {
    const n = r.cells.filter(Boolean).length;
    return `<tr><td class="name">${esc(r.name)}<span class="n">${n}枠</span></td>${r.cells.map(cellHtml).join('')}</tr>`;
  }).join('');
  $('#box').innerHTML = `<table>${head}<tbody>${body}</tbody></table>`;
}

$('#tabs').addEventListener('click', (e) => {
  const b = e.target.closest('.tab'); if (!b) return;
  cur = b.dataset.key;
  try { history.replaceState(null, '', '#d' + cur.replace('-', '')); } catch (err) {}
  renderTabs(); render();
  $('#box').scrollTop = 0;
});
$('#q').addEventListener('input', render);
$('#only').addEventListener('change', () => { try { localStorage.setItem('nmb34-plans-only', $('#only').checked ? '1' : '0'); } catch (e) {} render(); });
window.addEventListener('hashchange', () => {
  const ev = DATA.events.find((e) => e.key.replace('-', '') === location.hash.replace('#d', ''));
  if (ev && ev.key !== cur) { cur = ev.key; renderTabs(); render(); }
});

cur = DATA.events[0].key;
const hit = DATA.events.find((e) => e.key.replace('-', '') === location.hash.replace('#d', ''));
if (hit) cur = hit.key;
$('#src').textContent = `${DATA.meta.updated} 更新`;
renderTabs(); render();
</script>

</html>
